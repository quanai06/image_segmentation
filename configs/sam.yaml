prompts:
  min_region_area: 0.001    # bỏ vùng < 0.1% diện tích ảnh (chấm nhiễu của mặt nạ JPEG)
  n_pos: 3                  # P2: điểm dương (gồm điểm tâm)
  n_neg: 3                  # P2: điểm âm, lấy trong hộp nới rộng quanh tổn thương
  neg_margin: 0.5           # nới mỗi cạnh hộp thêm 50% kích thước
  jitter_px: 20             # P4a: lệch mỗi cạnh hộp tối đa 20 px (như MedSAM)
  jitter_rel: 0.1           # P4b: lệch tối đa 10% kích thước hộp

automatic:                  # P0: SamAutomaticMaskGenerator, tham số mặc định của SAM
  points_per_side: 32
  pred_iou_thresh: 0.88
  stability_score_thresh: 0.95

eval_size: 256
size_bins: [0.05, 0.20]     # nhỏ < 5% <= vừa < 20% <= lớn
seed: 0
