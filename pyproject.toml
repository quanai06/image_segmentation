[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medseg"
version = "0.1.0"
description = "Medical image segmentation: U-Net vs Transformer (Kvasir-SEG, CVC-ClinicDB)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
